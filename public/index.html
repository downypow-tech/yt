<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>plamtube premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --accent-color: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.45);
      --accent-border: rgba(239, 68, 68, 0.35);
      --accent-gradient: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1c0a0d 0%, #08080a 55%, #020203 100%);
      color: #f4f4f5;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    /* สไตล์ Liquid Glass สไตล์ iOS */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .liquid-glass-card {
      background: rgba(18, 18, 22, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .theme-accent-bg {
      background: var(--accent-gradient) !important;
    }

    .theme-accent-color {
      color: var(--accent-color) !important;
    }

    .theme-accent-border {
      border-color: var(--accent-border) !important;
    }

    .theme-accent-glow {
      box-shadow: 0 0 35px -5px var(--accent-glow) !important;
    }

    .spin {
      animation: spin 14s linear infinite;
    }
    .spin-paused {
      animation-play-state: paused;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Equalizer Wave Animation */
    .bar-anim {
      animation: barPulse 1.1s ease-in-out infinite alternate;
    }
    @keyframes barPulse {
      0% { height: 4px; }
      100% { height: 20px; }
    }
    .bar-paused {
      animation-play-state: paused;
      height: 4px !important;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-color);
    }

    /* ตำแหน่ง IFrame แบบสลับโหมด */
    .video-mode-frame {
      width: 100% !important;
      height: 100% !important;
      border-radius: 1rem;
      opacity: 1 !important;
      pointer-events: auto !important;
      z-index: 20 !important;
    }

    .audio-mode-frame {
      position: fixed !important;
      bottom: 0 !important;
      right: 0 !important;
      width: 180px !important;
      height: 180px !important;
      opacity: 0.001 !important;
      pointer-events: none !important;
      z-index: -999 !important;
    }
  </style>
</head>
<body class="flex flex-col justify-between p-3 sm:p-6 lg:p-8">

  <!-- แท็กเสียงเงียบป้องกันเครื่องตัดการทำงานเบื้องหลัง -->
  <audio id="silent-audio" loop playsinline preload="auto"></audio>

  <div class="w-full max-w-6xl mx-auto flex flex-col gap-4">

    <!-- Top Navigation Bar: Liquid Glass Island -->
    <header class="liquid-glass rounded-2xl px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="brand-badge" class="w-10 h-10 rounded-xl theme-accent-bg flex items-center justify-center text-white font-black text-xl shadow-lg border border-white/20">
          P
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-black tracking-wider uppercase text-white flex items-center gap-1.5">
            plam<span class="theme-accent-color">tube</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-white/10 border border-white/10 text-zinc-300 font-mono tracking-normal">PREMIUM</span>
          </h1>
          <p class="text-[11px] text-zinc-400 font-medium">Liquid Glass Engine &bull; iOS Style</p>
        </div>
      </div>

      <!-- Controls: Theme Color Picker & Timer -->
      <div class="flex items-center gap-2.5 sm:gap-4">
        
        <!-- จานสีเปลี่ยนธีม Liquid Theme Switcher -->
        <div class="flex items-center gap-1.5 bg-black/40 px-2 py-1 rounded-full border border-white/10">
          <button class="color-dot w-4 h-4 rounded-full bg-red-500 border border-white/40 transition active:scale-90" data-color="#ef4444" data-gradient="linear-gradient(135deg, #ef4444 0%, #991b1b 100%)" data-bg="radial-gradient(circle at 50% 0%, #1c0a0d 0%, #08080a 55%, #020203 100%)"></button>
          <button class="color-dot w-4 h-4 rounded-full bg-purple-500 border border-transparent hover:border-white/40 transition active:scale-90" data-color="#a855f7" data-gradient="linear-gradient(135deg, #a855f7 0%, #581c87 100%)" data-bg="radial-gradient(circle at 50% 0%, #14081e 0%, #08080a 55%, #020203 100%)"></button>
          <button class="color-dot w-4 h-4 rounded-full bg-cyan-400 border border-transparent hover:border-white/40 transition active:scale-90" data-color="#22d3ee" data-gradient="linear-gradient(135deg, #22d3ee 0%, #0e7490 100%)" data-bg="radial-gradient(circle at 50% 0%, #061820 0%, #08080a 55%, #020203 100%)"></button>

    <!-- Main Dynamic Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">

      <!-- Column 1: Liquid Player Container (Left) -->

        <!-- Search & URL Input -->

            <input 
              type="text"

        </div>

          <button id="btn-mix-mode" class="text-[11px] text-zinc-300 hover:text-white flex items-center gap-1.5 bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1 rounded-full transition active:scale-95">
            <i class="fa-solid fa-wand-magic-sparkles theme-accent-color"></i> เปิดมิกซ์เพลงนี้
          </button>
        </div>

        <!-- Player Stage: แผ่นเสียง Vinyl VS กรอบคลิป Video 16:9 -->
        <div class="w-full flex flex-col items-center justify-center py-2 relative min-h-[240px] sm:min-h-[290px]">

          <!-- 1. กรอบแสดงวิดีโอคลิป (Video Stage) -->
          <div id="video-stage" class="w-full aspect-video rounded-2xl overflow-hidden hidden shadow-2xl border border-white/10 relative">

          </div>

          <!-- 2. แผ่นเสียง Vinyl Stage (สำหรับโหมด Audio ปิดหน้าจอฟัง) -->

            <div id="vinyl" class="w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-zinc-950 border-4 border-zinc-900 theme-accent-glow flex items-center justify-center relative spin spin-paused transition-all duration-500 shadow-2xl">
              <div class="absolute inset-0 rounded-full border border-white/10 m-2.5 pointer-events-none"></div>
              <div class="absolute inset-0 rounded-full border border-white/5 m-7 pointer-events-none"></div>
              <div class="absolute inset-0 rounded-full border border-white/5 m-12 pointer-events-none"></div>
              
              <img

                src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&auto=format&fit=crop&q=80"

            <!-- Wave Equalizer Bars -->
            <div class="flex items-end justify-center gap-1 h-6 mt-4" id="visualizer-container">

              <div class="w-1 theme-accent-bg rounded-full bar-anim bar-paused" style="animation-delay: 0.5s;"></div>

              <div class="w-1 theme-accent-bg rounded-full bar-anim bar-paused" style="animation-delay: 0.4s;"></div>

        <!-- Track Info -->

        <!-- Controls & Volume Bar -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2 border-t border-white/10 px-2">
          
          <!-- Volume Slider -->
          <div class="flex items-center gap-2.5 w-full sm:w-auto order-2 sm:order-1">
            <button id="btn-mute" class="text-zinc-400 hover:text-white transition text-sm">
              <i id="volume-icon" class="fa-solid fa-volume-high"></i>

            <input 
              type="range" 
              id="volume-bar" 
              min="0" 
              max="100" 
              value="100" 
              class="w-24 sm:w-28 h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-white"
            />
            <span id="volume-text" class="text-[10px] text-zinc-400 font-mono w-6">100%</span>
          </div>

          <!-- Player Buttons -->
          <div class="flex items-center justify-center gap-5 sm:gap-6 order-1 sm:order-2 w-full sm:w-auto">
            <button id="btn-prev-track" title="เพลงก่อนหน้า" class="text-zinc-400 hover:text-white transition active:scale-90 text-base">
              <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="btn-backward" title="ย้อน 10 วินาที" class="text-zinc-400 hover:text-white transition active:scale-90 text-sm">
              <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="btn-toggle" class="w-14 h-14 theme-accent-bg text-white rounded-full flex items-center justify-center text-xl transition active:scale-95 shadow-xl border border-white/30">
              <i id="toggle-icon" class="fa-solid fa-play ml-0.5"></i>
            </button>
            <button id="btn-forward" title="ไปข้างหน้า 10 วินาที" class="text-zinc-400 hover:text-white transition active:scale-90 text-sm">
              <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button id="btn-next-track" title="เพลงถัดไป" class="text-zinc-400 hover:text-white transition active:scale-90 text-base">
              <i class="fa-solid fa-forward-step"></i>
            </button>
          </div>

        </div>

      </div>

      <!-- Column 2: Liquid Queue & History (Right) -->
      <div class="lg:col-span-5 flex flex-col gap-3 liquid-glass p-4 sm:p-5 rounded-3xl min-h-[460px]">
        
        <!-- Tab Switcher -->
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
          <div class="flex gap-4">
            <button id="tab-queue-btn" class="text-xs font-bold uppercase tracking-wider text-white border-b-2 theme-accent-border pb-1.5 flex items-center gap-1.5 transition">
              <i class="fa-solid fa-list-ol"></i> คิวเพลง (<span id="queue-badge">0</span>)
            </button>
            <button id="tab-history-btn" class="text-xs font-bold uppercase tracking-wider text-zinc-500 pb-1.5 flex items-center gap-1.5 transition">
              <i class="fa-solid fa-clock-rotate-left"></i> ประวัติ (<span id="history-badge">0</span>)
            </button>
          </div>
          <button id="btn-clear-tab" class="text-[11px] text-zinc-400 hover:text-white transition flex items-center gap-1">
            <i class="fa-solid fa-trash-can text-[10px]"></i> ล้างแท็บนี้
          </button>
        </div>

        <!-- Container: Queue List -->
        <div id="queue-container" class="space-y-2 max-h-[380px] lg:max-h-[500px] overflow-y-auto pr-1"></div>

        <!-- Container: History List -->
        <div id="history-container" class="space-y-2 max-h-[380px] lg:max-h-[500px] overflow-y-auto pr-1 hidden"></div>

      </div>

    </div>

    <!-- Hidden Default Container for Audio Mode IFrame -->
    <div id="hidden-player-box" class="audio-mode-frame">
      <div id="yt-player"></div>
    </div>

    <!-- Footer -->
    <footer class="text-[11px] text-zinc-500 text-center py-2">
      plamtube premium &bull; iOS Liquid Glass Style &bull; Background Lock Play Ready
    </footer>

  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player = null;
    let isReady = false;
    let currentVideoId = null;
    let currentTrack = null;
    let timer = null;
    let sleepTimerInterval = null;
    let sleepSecondsRemaining = 0;
    let currentVolume = 100;
    let isMuted = false;
    let isVideoMode = false; // สถานะโหมดวิดีโอ

    let songQueue = [];
    let currentTab = 'queue';

    const silentAudio = document.getElementById('silent-audio');
    silentAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";

    const urlInput = document.getElementById('url-input');
    const btnPlay = document.getElementById('btn-play');
    const btnText = document.getElementById('btn-text');
    const statusHint = document.getElementById('status-hint');
    const searchResults = document.getElementById('search-results');
    const vinyl = document.getElementById('vinyl');
    const trackCover = document.getElementById('track-cover');
    const trackTitle = document.getElementById('track-title');
    const trackAuthor = document.getElementById('track-author');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeElem = document.getElementById('current-time');
    const durationElem = document.getElementById('duration-time');
    const btnToggle = document.getElementById('btn-toggle');
    const toggleIcon = document.getElementById('toggle-icon');
    const queueContainer = document.getElementById('queue-container');
    const historyContainer = document.getElementById('history-container');
    const queueBadge = document.getElementById('queue-badge');
    const historyBadge = document.getElementById('history-badge');
    const tabQueueBtn = document.getElementById('tab-queue-btn');
    const tabHistoryBtn = document.getElementById('tab-history-btn');
    const btnClearTab = document.getElementById('btn-clear-tab');
    const btnMixMode = document.getElementById('btn-mix-mode');
    const timerSelect = document.getElementById('timer-select');
    const timerCountdown = document.getElementById('timer-countdown');
    const volumeBar = document.getElementById('volume-bar');
    const volumeText = document.getElementById('volume-text');
    const btnMute = document.getElementById('btn-mute');
    const volumeIcon = document.getElementById('volume-icon');
    const visualizerBars = document.querySelectorAll('.bar-anim');

    // โหมดสลับคลิป/แผ่นเสียง
    const btnToggleMode = document.getElementById('btn-toggle-mode');
    const modeIcon = document.getElementById('mode-icon');
    const modeText = document.getElementById('mode-text');
    const videoStage = document.getElementById('video-stage');
    const vinylStage = document.getElementById('vinyl-stage');
    const videoWrapper = document.getElementById('video-wrapper');
    const hiddenPlayerBox = document.getElementById('hidden-player-box');

    // 1. ระบบ Theme Color Switcher
    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const color = dot.dataset.color;
        const gradient = dot.dataset.gradient;
        const bg = dot.dataset.bg;

        document.documentElement.style.setProperty('--accent-color', color);
        document.documentElement.style.setProperty('--accent-glow', color + '73');
        document.documentElement.style.setProperty('--accent-border', color + '55');
        document.documentElement.style.setProperty('--accent-gradient', gradient);
        document.body.style.background = bg;

        document.querySelectorAll('.color-dot').forEach(d => d.style.borderColor = 'transparent');
        dot.style.borderColor = '#ffffff';
      });
    });

    // 2. ระบบสลับโหมดคลิปวิดีโอ (Video Mode) / แผ่นเสียง (Audio Mode)
    btnToggleMode.addEventListener('click', () => {
      isVideoMode = !isVideoMode;
      const ytIframe = document.getElementById('yt-player');

      if (isVideoMode) {
        // ย้าย IFrame มาไว้ในกรอบวิดีโอ
        videoStage.classList.remove('hidden');
        vinylStage.classList.add('hidden');
        videoWrapper.appendChild(ytIframe);
        ytIframe.className = "video-mode-frame";

        modeIcon.className = "fa-solid fa-compact-disc theme-accent-color";
        modeText.innerText = "โหมดแผ่นเสียง (ปิดจอ)";
        statusHint.innerText = "กำลังรับชมแบบวิดีโอคลิป";
      } else {
        // ย้าย IFrame กลับไปซ่อนในกล่องพื้นหลัง
        videoStage.classList.add('hidden');
        vinylStage.classList.remove('hidden');
        hiddenPlayerBox.appendChild(ytIframe);
        ytIframe.className = "audio-mode-frame";

        modeIcon.className = "fa-solid fa-film theme-accent-color";
        modeText.innerText = "โหมดดูคลิป";
        statusHint.innerText = "โหมดเสียง: พับจอหรือปิดหน้าจอได้ทันที";
      }
    });

    // 3. YouTube API Initial
    function initYouTube() {
      if (player) return;
      player = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'playsinline': 1,
          'origin': window.location.origin
        },
        events: {
          'onReady': () => {
            isReady = true;
            renderQueue();
            renderHistory();
          },
          'onStateChange': onStateChange,
          'onError': () => {
            playNextInQueue();
          }
        }
      });
    }

    window.onYouTubeIframeAPIReady = initYouTube;

    const checkYT = setInterval(() => {
      if (window.YT && window.YT.Player) {
        initYouTube();
        clearInterval(checkYT);
      }
    }, 500);

    function parseYouTubeInput(url) {
      if (!url) return { videoId: null, listId: null };
      url = url.trim();

      const listMatch = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
      const listId = listMatch ? listMatch[1] : null;

      const videoMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      let videoId = videoMatch ? videoMatch[1] : null;

      if (!videoId && /^[a-zA-Z0-9_-]{11}$/.test(url)) {
        videoId = url;
      }

      return { videoId, listId };
    }

    function formatTime(s) {
      if (isNaN(s) || s < 0) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function onStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        vinyl.classList.remove('spin-paused');
        toggleIcon.className = "fa-solid fa-pause";
        visualizerBars.forEach(b => b.classList.remove('bar-paused'));
        silentAudio.play().catch(() => {});
        startTimer();
        syncTrackInfo();
      } else if (e.data === YT.PlayerState.PAUSED) {
        vinyl.classList.add('spin-paused');
        toggleIcon.className = "fa-solid fa-play ml-0.5";
        visualizerBars.forEach(b => b.classList.add('bar-paused'));
        silentAudio.pause();
        clearInterval(timer);
      } else if (e.data === YT.PlayerState.ENDED) {
        vinyl.classList.add('spin-paused');
        toggleIcon.className = "fa-solid fa-play ml-0.5";
        visualizerBars.forEach(b => b.classList.add('bar-paused'));
        silentAudio.pause();
        clearInterval(timer);
        playNextInQueue();
      }
    }

    function syncTrackInfo() {
      setTimeout(() => {
        if (player && player.getVideoData) {
          const vData = player.getVideoData();
          if (vData && vData.video_id) {
            currentVideoId = vData.video_id;
            currentTrack = {
              id: vData.video_id,
              title: vData.title || "กำลังเล่น",
              author: vData.author || "YouTube Artist",
              cover: `https://img.youtube.com/vi/${vData.video_id}/hqdefault.jpg`,
              timestamp: Date.now()
            };
            trackTitle.innerText = currentTrack.title;
            trackAuthor.innerText = currentTrack.author;
            trackCover.src = currentTrack.cover;
            saveHistory(currentTrack);
            setupMediaSession();
          }
        }
      }, 1000);
    }

    // ระบบ Volume Slider & Mute
    volumeBar.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      currentVolume = val;
      volumeText.innerText = `${val}%`;
      if (isReady && player && player.setVolume) {
        if (val === 0) {
          player.mute();
          isMuted = true;
          volumeIcon.className = "fa-solid fa-volume-xmark text-red-500";
        } else {
          player.unMute();
          player.setVolume(val);
          isMuted = false;
          volumeIcon.className = val > 50 ? "fa-solid fa-volume-high" : "fa-solid fa-volume-low";
        }
      }
    });

    btnMute.addEventListener('click', () => {
      if (!isReady || !player) return;
      if (isMuted) {
        player.unMute();
        player.setVolume(currentVolume || 50);
        volumeBar.value = currentVolume || 50;
        volumeText.innerText = `${currentVolume || 50}%`;
        volumeIcon.className = (currentVolume || 50) > 50 ? "fa-solid fa-volume-high" : "fa-solid fa-volume-low";
        isMuted = false;
      } else {
        player.mute();
        volumeBar.value = 0;
        volumeText.innerText = "0%";
        volumeIcon.className = "fa-solid fa-volume-xmark text-red-500";
        isMuted = true;
      }
    });

    // ค้นหาเพลงผ่าน JSONP
    window.handleSuggestions = function(data) {
      const suggestions = (data && data[1]) ? data[1] : [];
      if (suggestions.length === 0) {
        playSongBySearch(urlInput.value.trim());
        return;
      }
      renderSearchResults(suggestions.slice(0, 6));
    };

    function searchTracks(query) {
      statusHint.innerText = `กำลังค้นหา "${query}"...`;
      btnText.innerText = "ค้นหา...";

      const oldScript = document.getElementById('jsonp-search');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-search';
      script.src = `https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=${encodeURIComponent(query)}&jsonp=handleSuggestions`;
      script.onerror = () => {
        playSongBySearch(query);
      };
      document.body.appendChild(script);
    }

    function renderSearchResults(items) {
      searchResults.innerHTML = '';
      items.forEach(itemData => {
        const text = Array.isArray(itemData) ? itemData[0] : itemData;
        const div = document.createElement('div');
        div.className = "flex items-center justify-between p-2.5 rounded-xl hover:bg-white/10 cursor-pointer transition active:scale-[0.99] text-zinc-200 text-xs border border-transparent hover:border-white/10";
        
        div.innerHTML = `
          <div class="flex items-center gap-2.5 flex-1 min-w-0 pr-2">
            <i class="fa-brands fa-youtube theme-accent-color text-sm"></i>
            <span class="truncate">${text}</span>
          </div>
          <button class="btn-add-queue bg-white/10 hover:bg-white/20 text-zinc-200 text-[11px] px-2.5 py-1 rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> คิว
          </button>
        `;

        div.querySelector('.flex-1').addEventListener('click', () => {
          searchResults.classList.add('hidden');
          urlInput.value = text;
          playSongBySearch(text);
        });

        div.querySelector('.btn-add-queue').addEventListener('click', (e) => {
          e.stopPropagation();
          searchResults.classList.add('hidden');
          addToQueueBySearch(text);
        });

        searchResults.appendChild(div);
      });
      searchResults.classList.remove('hidden');
      btnText.innerText = "เล่นทันที";
    }

    document.addEventListener('click', (e) => {
      if (!searchResults.contains(e.target) && e.target !== urlInput && e.target !== btnPlay) {
        searchResults.classList.add('hidden');
      }
    });

    async function playSongBySearch(query) {
      if (!isReady || !player) return;
      statusHint.innerText = `กำลังดึงเพลง "${query}"...`;

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data && data.videoId) {
          playSong(data.videoId);
        } else {
          statusHint.innerText = "ไม่พบเพลงนี้ ลองคำอื่นดูครับ";
        }
      } catch (err) {
        statusHint.innerText = "การค้นหาขัดข้อง";
      }
    }

    async function addToQueueBySearch(query) {
      statusHint.innerText = `กำลังเพิ่ม "${query}" เข้าคิว...`;
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data && data.videoId) {
          const meta = await fetchMetadata(data.videoId);
          enqueueTrack({
            id: data.videoId,
            title: meta.title,
            author: meta.author,
            cover: `https://img.youtube.com/vi/${data.videoId}/hqdefault.jpg`
          });
          statusHint.innerText = `เพิ่ม "${meta.title}" ในคิวแล้ว`;
        }
      } catch (e) {
        statusHint.innerText = "ไม่สามารถเพิ่มเข้าคิวได้";
      }
    }

    async function fetchMetadata(videoId) {
      try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
        const data = await res.json();
        return {
          title: data.title || `Track (${videoId})`,
          author: data.author_name || "YouTube Creator"
        };
      } catch {
        return { title: `Track (${videoId})`, author: "YouTube Creator" };
      }
    }

    function playPlaylist(listId, videoId = null) {
      if (!isReady || !player) return;
      statusHint.innerText = "กำลังเริ่มเล่นมิกซ์เพลงแนะนำ...";
      player.loadPlaylist({
        list: listId,
        listType: 'playlist',
        index: 0
      });
    }

    async function playSong(videoId) {
      if (!isReady || !player) return;
      currentVideoId = videoId;
      statusHint.innerText = "กำลังโหลดเพลง...";

      player.loadVideoById(videoId);

      const meta = await fetchMetadata(videoId);
      currentTrack = {
        id: videoId,
        title: meta.title,
        author: meta.author,
        cover: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
        timestamp: Date.now()
      };

      trackTitle.innerText = currentTrack.title;
      trackAuthor.innerText = currentTrack.author;
      trackCover.src = currentTrack.cover;
      saveHistory(currentTrack);
    }

    // จัดการคิวเพลง
    function enqueueTrack(item) {
      songQueue.push(item);
      renderQueue();
      if (!currentVideoId || (player && player.getPlayerState && player.getPlayerState() !== YT.PlayerState.PLAYING)) {
        playNextInQueue();
      }
    }

    function playNextInQueue() {
      if (songQueue.length > 0) {
        const nextTrack = songQueue.shift();
        renderQueue();
        playSong(nextTrack.id);
      } else if (player && player.nextVideo) {
        player.nextVideo();
      }
    }

    function renderQueue() {
      queueBadge.innerText = songQueue.length;
      queueContainer.innerHTML = '';

      if (songQueue.length === 0) {
        queueContainer.innerHTML = `
          <div class="text-center py-12 text-zinc-500 text-xs">
            <i class="fa-solid fa-list-ol text-2xl mb-2 text-zinc-600"></i>
            <p class="font-medium text-zinc-300">ยังไม่มีเพลงในคิวถัดไป</p>
            <p class="text-[11px] text-zinc-500 mt-1">กด "+ คิว" จากการค้นหา หรือเลือกจากประวัติ</p>
          </div>
        `;
        return;
      }

      songQueue.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "flex items-center gap-3 p-2.5 bg-white/5 hover:bg-white/10 border border-white/5 rounded-2xl cursor-pointer transition text-xs group";
        div.innerHTML = `
          <span class="text-xs font-mono text-zinc-400 w-5 text-center">${index + 1}</span>
          <img src="${item.cover}" class="w-11 h-11 rounded-xl object-cover flex-shrink-0 bg-zinc-800" />
          <div class="flex-1 min-w-0 pr-1">
            <p class="text-xs font-medium truncate text-zinc-100 group-hover:text-white transition">${item.title}</p>
            <p class="text-[11px] text-zinc-400 truncate mt-0.5">${item.author}</p>
          </div>
          <button class="btn-del-queue text-zinc-500 hover:text-red-400 p-2 text-sm transition">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;

        div.addEventListener('click', () => {
          songQueue.splice(index, 1);
          renderQueue();
          playSong(item.id);
        });

        div.querySelector('.btn-del-queue').addEventListener('click', (e) => {
          e.stopPropagation();
          songQueue.splice(index, 1);
          renderQueue();
        });

        queueContainer.appendChild(div);
      });
    }

    // ประวัติการฟัง
    function getHistory() {
      return JSON.parse(localStorage.getItem('plamtube_history') || '[]');
    }

    function saveHistory(item) {
      if (!item || !item.id) return;
      let list = getHistory().filter(x => x.id !== item.id);
      list.unshift(item);
      if (list.length > 40) list.pop();
      localStorage.setItem('plamtube_history', JSON.stringify(list));
      renderHistory();
    }

    function deleteHistory(id, e) {
      e.stopPropagation();
      let list = getHistory().filter(x => x.id !== id);
      localStorage.setItem('plamtube_history', JSON.stringify(list));
      renderHistory();
    }

    function renderHistory() {
      const list = getHistory();
      historyBadge.innerText = list.length;
      historyContainer.innerHTML = '';

      if (list.length === 0) {
        historyContainer.innerHTML = `
          <div class="text-center py-12 text-zinc-500 text-xs">
            <i class="fa-solid fa-compact-disc text-2xl mb-2 text-zinc-600"></i>
            <p class="font-medium text-zinc-300">ยังไม่มีประวัติการฟังเพลง</p>
          </div>
        `;
        return;
      }

      list.forEach(item => {
        const timeAgo = formatTimeAgo(item.timestamp);
        const div = document.createElement('div');
        div.className = "flex items-center gap-3 p-2.5 bg-white/5 hover:bg-white/10 border border-white/5 rounded-2xl cursor-pointer transition text-xs group";

        div.innerHTML = `
          <img src="${item.cover}" class="w-11 h-11 rounded-xl object-cover flex-shrink-0 bg-zinc-800" />
          <div class="flex-1 min-w-0 pr-1">
            <p class="text-xs font-semibold truncate text-zinc-200 group-hover:text-white transition">${item.title}</p>
            <div class="flex items-center gap-2 mt-0.5 text-[10px] text-zinc-400">
              <span class="truncate max-w-[110px]">${item.author}</span>
              <span>&bull;</span>
              <span>${timeAgo}</span>
            </div>
          </div>
          <button class="btn-hist-queue bg-white/10 hover:bg-white/20 text-zinc-200 text-[10px] px-2 py-1 rounded-lg transition flex items-center gap-1" title="เพิ่มเข้าคิวเล่น">
            <i class="fa-solid fa-plus"></i> คิว
          </button>
          <button class="btn-del text-zinc-500 hover:text-red-400 p-2 text-xs transition" title="ลบออกจากประวัติ">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;

        div.addEventListener('click', () => playSong(item.id));

        div.querySelector('.btn-hist-queue').addEventListener('click', (e) => {
          e.stopPropagation();
          enqueueTrack({
            id: item.id,
            title: item.title,
            author: item.author,
            cover: item.cover
          });
          statusHint.innerText = `เพิ่ม "${item.title}" เข้าคิวแล้ว`;
        });

        div.querySelector('.btn-del').addEventListener('click', (e) => deleteHistory(item.id, e));

        historyContainer.appendChild(div);
      });
    }

    function formatTimeAgo(ts) {
      if (!ts) return '';
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return "เมื่อครู่";
      if (diff < 3600) return `${Math.floor(diff / 60)} น. ที่แล้ว`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} ชม. ที่แล้ว`;
      return `${Math.floor(diff / 86400)} วันที่แล้ว`;
    }

    // สลับแท็บ
    tabQueueBtn.addEventListener('click', () => {
      currentTab = 'queue';
      tabQueueBtn.className = "text-xs font-bold uppercase tracking-wider text-white border-b-2 theme-accent-border pb-1.5 flex items-center gap-1.5 transition";
      tabHistoryBtn.className = "text-xs font-bold uppercase tracking-wider text-zinc-500 pb-1.5 flex items-center gap-1.5 transition";
      queueContainer.classList.remove('hidden');
      historyContainer.classList.add('hidden');
    });

    tabHistoryBtn.addEventListener('click', () => {
      currentTab = 'history';
      tabHistoryBtn.className = "text-xs font-bold uppercase tracking-wider text-white border-b-2 theme-accent-border pb-1.5 flex items-center gap-1.5 transition";
      tabQueueBtn.className = "text-xs font-bold uppercase tracking-wider text-zinc-500 pb-1.5 flex items-center gap-1.5 transition";
      historyContainer.classList.remove('hidden');
      queueContainer.classList.add('hidden');
    });

    btnClearTab.addEventListener('click', () => {
      if (currentTab === 'queue') {
        songQueue = [];
        renderQueue();
      } else {
        localStorage.removeItem('plamtube_history');
        renderHistory();
      }
    });

    // Sleep Timer
    timerSelect.addEventListener('change', (e) => {
      clearInterval(sleepTimerInterval);
      const minutes = parseInt(e.target.value);
      if (minutes === 0) {
        timerCountdown.classList.add('hidden');
        return;
      }

      sleepSecondsRemaining = minutes * 60;
      timerCountdown.classList.remove('hidden');
      updateTimerDisplay();

      sleepTimerInterval = setInterval(() => {
        sleepSecondsRemaining--;
        updateTimerDisplay();

        if (sleepSecondsRemaining <= 0) {
          clearInterval(sleepTimerInterval);
          if (player && player.pauseVideo) player.pauseVideo();
          silentAudio.pause();
          timerCountdown.innerText = "หยุดแล้ว";
          timerSelect.value = "0";
          statusHint.innerText = "ตัวจับเวลาทำงาน: หยุดเล่นแล้ว";
        }
      }, 1000);
    });

    function updateTimerDisplay() {
      const m = Math.floor(sleepSecondsRemaining / 60);
      const s = sleepSecondsRemaining % 60;
      timerCountdown.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // ปุ่มมิกซ์วิทยุ
    btnMixMode.addEventListener('click', () => {
      if (!currentVideoId) {
        alert("กรุณาเลือกเล่นเพลงก่อนเพื่อเปิดมิกซ์");
        return;
      }
      playPlaylist(`RD${currentVideoId}`);
    });

    btnPlay.addEventListener('click', () => {
      const val = urlInput.value.trim();
      if (!val) return;

      const { videoId, listId } = parseYouTubeInput(val);

      if (listId) {
        searchResults.classList.add('hidden');
        playPlaylist(listId, videoId);
        urlInput.value = '';
      } else if (videoId) {
        searchResults.classList.add('hidden');
        playSong(videoId);
        urlInput.value = '';
      } else {
        searchTracks(val);
      }
    });

    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btnPlay.click();
    });

    btnToggle.addEventListener('click', () => {
      if (!isReady || !player) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    document.getElementById('btn-next-track').addEventListener('click', () => {
      playNextInQueue();
    });

    document.getElementById('btn-prev-track').addEventListener('click', () => {
      if (isReady && player && player.previousVideo) player.previousVideo();
    });

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(() => {
        if (isReady && player.getCurrentTime) {
          const cur = player.getCurrentTime();
          const dur = player.getDuration();
          if (dur > 0) {
            seekBar.value = (cur / dur) * 100;
            currentTimeElem.innerText = formatTime(cur);
            durationElem.innerText = formatTime(dur);
          }
        }
      }, 500);
    }

    seekBar.addEventListener('input', (e) => {
      if (isReady && player.getDuration) {
        player.seekTo((e.target.value / 100) * player.getDuration(), true);
      }
    });

    document.getElementById('btn-backward').addEventListener('click', () => {
      if (isReady && player) player.seekTo(Math.max(0, player.getCurrentTime() - 10), true);
    });

    document.getElementById('btn-forward').addEventListener('click', () => {
      if (isReady && player) player.seekTo(player.getCurrentTime() + 10, true);
    });

    function setupMediaSession() {
      if ('mediaSession' in navigator && currentTrack) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: currentTrack.title,
          artist: currentTrack.author,
          album: 'plamtube Premium',
          artwork: [{ src: currentTrack.cover, sizes: '512x512', type: 'image/jpeg' }]
        });
        navigator.mediaSession.setActionHandler('play', () => player.playVideo());
        navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNextInQueue());
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          if (player.previousVideo) player.previousVideo();
        });
        navigator.mediaSession.setActionHandler('seekbackward', () => {
          player.seekTo(Math.max(0, player.getCurrentTime() - 10), true);
        });
        navigator.mediaSession.setActionHandler('seekforward', () => {
          player.seekTo(player.getCurrentTime() + 10, true);
        });
      }
    }

    renderHistory();
  </script>
</body>
</html>
